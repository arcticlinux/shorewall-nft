name: EL10 RPM

# Build the shorewall-nft RPM on AlmaLinux 10 so its dependencies and %{_sbindir}
# match an EL10 server. Runs on a push to this branch.
on:
  push:
    branches: [el10-build]
  workflow_dispatch:

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      # git must be present before checkout, or actions/checkout falls back to
      # an API tarball with no .git and git archive cannot run.
      - name: Install git
        run: dnf -y install git

      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf -y install rpm-build rpmdevtools systemd-rpm-macros selinux-policy-devel make bzip2 python3 nftables

      - name: Build the source tarball
        run: |
          rpmdev-setuptree
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=$(awk '/^Version:/{print $2}' packaging/shorewall-nft.spec)
          git archive --format=tar.gz --prefix="shorewall-nft-$v/" \
            -o "$HOME/rpmbuild/SOURCES/shorewall-nft-$v.tar.gz" HEAD

      - name: Build the .rpm
        run: rpmbuild -bb packaging/shorewall-nft.spec

      - name: Collect and smoke-test
        run: |
          mkdir -p dist
          cp "$HOME"/rpmbuild/RPMS/noarch/*.rpm dist/
          rpm -qpR dist/shorewall-nft-0*.rpm | grep -v '^rpmlib'
          dnf -y install ./dist/shorewall-nft-0*.rpm
          shorewall version
          shorewall compile tests/corpus/0003-two-interfaces/config -o /tmp/out.nft
          test -s /tmp/out.nft
          # The policy module compiled and is packaged; it cannot be loaded in a container.
          rpm -qpl dist/shorewall-nft-selinux-*.rpm | grep -E 'shorewall_nft\.pp\.bz2$'
          rpm -qp --scripts dist/shorewall-nft-selinux-*.rpm | grep -c semodule
          bin=$(sed -n 's/^ExecStart=\([^ ]*\).*/\1/p' /usr/lib/systemd/system/shorewall.service)
          echo "unit ExecStart binary: $bin"
          test -x "$bin"

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-el10
          path: dist/*.rpm
